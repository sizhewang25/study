# The paper's pooled traffic-filtered (TF) datasets, declared once.
#
#   python -m scripts.analysis.v5.cli plot-error-cdf --group pro-tf
#   scripts/analysis/v5/create_tf_artifacts.sh        # all three figures
#
# Same shape as pro-paper.yaml, cut down to three figures on seen sites:
# the error CDF, the outcome bars (unbounded and bounded) and the Pareto
# frontier (unbounded and bounded). There are no LOSO twins of the TF runs, so
# the group has no `unseen` role and nothing here reads one.
#
# The TF runs live on the TF machine: their committed configs carry
# placeholder source paths. Run this there.
#
# Under --group, pooled outputs land in _cross/<kind>/pro-tf/ (the seen runs
# are every member, so no `.seen` suffix).

group_id: pro-tf

runs:
  seen: [pro-as01-weighted, pro-as02-weighted, pro-as03-weighted]   # K-fold, the meshes' folds

analysis:
  common:
    # The MESH bounds, on purpose: every TF axis is drawn against the same D
    # and R_max as the pro-paper figures, so the two sets compare directly.
    # Do not run report-bounds on this group alone: the TF subset's largest
    # RTT can be below R_max, which it would report as a mismatch.
    dist_norm_km:
      min: 0.0
      max: 4387.257
    rtt_norm_ms:
      min: 0.0
      max: 92.395

  plot-error-cdf:
    layout: pooled
    unanswered: cut
    run-id: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]

  # Unbounded and bounded in one call.
  plot-outcome-bars:
    layout: [pooled, compare]
    mode: [bounded, unbounded]
    run-id: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]

  # Seen only: writes pareto.cell.seen (unbounded) and pareto.bounded.seen.
  plot-pareto:
    seen: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]
