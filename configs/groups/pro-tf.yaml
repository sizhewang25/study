# The paper's pooled traffic-filtered (TF) datasets, declared once.
#
#   python -m scripts.analysis.v5.cli plot-error-cdf --group pro-tf
#   scripts/analysis/v5/create_tf_artifacts.sh        # every figure below
#
# Same shape as pro-paper.yaml, cut down to the figures on seen sites: the
# error CDF, the outcome bars (bounded, unbounded and split by single- vs
# multi-VP TGs), the Pareto frontier (unbounded and bounded), and the VP-count
# distribution with its has-X / no-X split. There are no LOSO twins of the TF
# runs, so the group has no `unseen` role and nothing here reads one.
#
# The TF runs live on the TF machine: their committed configs carry
# placeholder source paths. Run this there.
#
# Under --group, pooled outputs land in _cross/<kind>/pro-tf/ (the seen runs
# are every member, so no `.seen` suffix).

group_id: pro-tf

runs:
  seen: [pro-as01-weighted, pro-as02-weighted, pro-as03-weighted]   # K-fold, the meshes' folds

analysis:
  common:
    # The MESH bounds, on purpose: every TF axis is drawn against the same D
    # and R_max as the pro-paper figures, so the two sets compare directly.
    # Do not run report-bounds on this group alone: the TF subset's largest
    # RTT can be below R_max, which it would report as a mismatch.
    dist_norm_km:
      min: 0.0
      max: 4387.257
    rtt_norm_ms:
      min: 0.0
      max: 92.395

  plot-error-cdf:
    layout: pooled
    unanswered: cut
    run-id: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]

  # Bounded, unbounded, and `vp` (correct / wrong split by single- vs
  # multi-VP TGs) in one call.
  plot-outcome-bars:
    layout: [pooled, compare]
    mode: [bounded, unbounded, vp]
    run-id: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]

  # Seen only: writes pareto.cell.seen (unbounded) and pareto.bounded.seen.
  plot-pareto:
    seen: "@seen"
    method: [shortest_ping, million_scale_cbg, vanilla_cbg, octant_cbg_hull, octant_cbg_spl, spotter_cbg]

  # How many VPs measured each TG after the traffic filter, and how the
  # single-VP TGs fall across has-X / no-X. The has-X figure reads each run's
  # report-sp-pni-cells CSV, which create_tf_artifacts.sh builds per run.
  plot-vp-obs-hist:
    layout: [pooled, compare]
    run-id: "@seen"

  plot-vp-obs-has-x:
    layout: [pooled, compare]
    run-id: "@seen"
